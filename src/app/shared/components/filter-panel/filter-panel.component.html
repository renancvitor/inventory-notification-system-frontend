<div class="filter-panel">

  <h3 class="filter-panel__title">Filtros</h3>

  <div class="filter-panel__content">
    <ng-content></ng-content>
  </div>

  <div class="filter-panel__actions">
    <app-button class="filter-panel__clear-action" (click)="filtersCleared.emit()">
      Limpar
    </app-button>

    <app-button class="filter-panel__apply-action" (click)="filtersApplied.emit()">
      Aplicar
    </app-button>
  </div>

</div>
