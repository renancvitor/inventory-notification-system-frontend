<div class="search-field">

    <span class="search-field__label">{{ label }}</span>

    <div class="search-field__input">

        <input
            type="text"
            [placeholder]="placeholder"
            [(ngModel)]="searchTerm"
            (input)="onInput()"
        >

        <mat-icon>search</mat-icon>

    </div>
    
</div>
