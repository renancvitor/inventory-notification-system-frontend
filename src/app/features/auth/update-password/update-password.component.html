<form class="update-password-page" [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-card class="update-password-page__card">
    <div class="update-password-page__header">
      <h2 class="update-password-page__title">{{ title }}</h2>
      <p class="update-password-page__description">{{ description }}</p>
    </div>

    <div class="update-password-page__grid">
      <mat-form-field appearance="outline" class="update-password-page__field">
        <mat-label>Senha atual</mat-label>
        <input
          matInput
          [type]="hideCurrentPassword ? 'password' : 'text'"
          formControlName="currentPassword"
          autocomplete="current-password"
        >

        <button
          mat-icon-button
          matSuffix
          type="button"
          tabindex="-1"
          aria-label="Alternar visibilidade da senha atual"
          (click)="toggleCurrentPasswordVisibility()"
        >
          <mat-icon>{{ hideCurrentPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>

        <mat-error *ngIf="form.controls.currentPassword.hasError('required') && form.controls.currentPassword.touched">
          O campo de senha atual é obrigatório.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="update-password-page__field">
        <mat-label>Nova senha</mat-label>
        <input
          matInput
          [type]="hideNewPassword ? 'password' : 'text'"
          formControlName="newPassword"
          autocomplete="new-password"
        >

        <button
          mat-icon-button
          matSuffix
          type="button"
          tabindex="-1"
          aria-label="Alternar visibilidade da nova senha"
          (click)="toggleNewPasswordVisibility()"
        >
          <mat-icon>{{ hideNewPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>

        <mat-error *ngIf="form.controls.newPassword.hasError('required') && form.controls.newPassword.touched">
          O campo de nova senha é obrigatório.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="update-password-page__field">
        <mat-label>Confirmar nova senha</mat-label>
        <input
          matInput
          [type]="hideConfirmNewPassword ? 'password' : 'text'"
          formControlName="confirmNewPassword"
          autocomplete="new-password"
        >

        <button
          mat-icon-button
          matSuffix
          type="button"
          tabindex="-1"
          aria-label="Alternar visibilidade da confirmação da senha"
          (click)="toggleConfirmNewPasswordVisibility()"
        >
          <mat-icon>{{ hideConfirmNewPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>

        <mat-error *ngIf="form.controls.confirmNewPassword.hasError('required') && form.controls.confirmNewPassword.touched">
          A confirmação da nova senha é obrigatória.
        </mat-error>
      </mat-form-field>
    </div>

    <section class="update-password-page__rules" aria-label="Regras da nova senha">
      <h3 class="update-password-page__rules-title">Validação da nova senha</h3>

      <ul class="update-password-page__rules-list">
        <li *ngFor="let rule of passwordRules">{{ rule }}</li>
      </ul>
    </section>

    <div class="update-password-page__actions">
      <app-button
        class="update-password-page__action update-password-page__action--primary"
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Salvando...' : submitLabel }}
      </app-button>

      <app-button
        *ngIf="showCancelButton"
        class="update-password-page__action update-password-page__action--secondary"
        type="button"
        (click)="cancel.emit()"
      >
        {{ cancelLabel }}
      </app-button>
    </div>
  </mat-card>
</form>
