<div class="login-wrapper">

  <mat-card class="login-card">

    <h2 class="login-title">Acesse sua conta</h2>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nome de usuário</mat-label>
      <input matInput>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Senha</mat-label>
      <input matInput>
    </mat-form-field>

    <button
      mat-raised-button
      class="login-button">
      Entrar
    </button>

  </mat-card>

</div>
