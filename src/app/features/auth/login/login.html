<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <div class="login-wrapper">

    <mat-card class="login-card">

      <h2 class="login-title">Acesse sua conta</h2>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nome de usuário</mat-label>
        <input matInput formControlName="email">

        <mat-error *ngIf="loginForm.controls.email.hasError('required')">
          O campo de e-mail é obrigatório.
        </mat-error>

        <mat-error *ngIf="loginForm.controls.email.hasError('email')">
          E-mail inválido.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password">

        <mat-error *ngIf="loginForm.controls.password.hasError('required')">
          O campo de senha é obrigatório.
        </mat-error>

        <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
          Mínimo de 6 caracteres.
        </mat-error>
      </mat-form-field>

      <div class="login-error" ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        mat-raised-button
        class="login-button"
        type="submit"
        [disabled]="loginForm.invalid">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

    </mat-card>

  </div>

</form>
