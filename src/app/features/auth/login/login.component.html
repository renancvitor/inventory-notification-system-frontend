<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

  <div class="login-page">

    <mat-card class="login-page__card">

      <h2 class="login-page__title">Acesse sua conta</h2>

      <mat-form-field appearance="outline" class="login-page__field">
        <mat-label>Nome de usuário</mat-label>
        <input matInput formControlName="email">

        <mat-error *ngIf="loginForm.controls.email.hasError('required')">
          O campo de e-mail é obrigatório.
        </mat-error>

        <mat-error *ngIf="loginForm.controls.email.hasError('email')">
          E-mail inválido.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="login-page__field">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="password">

        <mat-error *ngIf="loginForm.controls.password.hasError('required')">
          O campo de senha é obrigatório.
        </mat-error>

        <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
          Mínimo de 6 caracteres.
        </mat-error>
      </mat-form-field>

      <app-button
        mat-raised-button
        class="login-page__submit"
        type="submit"
        [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </app-button>

    </mat-card>

  </div>

</form>
