<div class="user-page">

    <div class="page-header">
        <div>
            <h2>Usuários</h2>
            <p>Gerencie os usuários do sistema • {{ totalUsers }} usuários cadastrados</p>
        </div>

        <app-button class="new-user-btn">
            Novo usuário
        </app-button>
    </div>

    <div class="toolbar">
        <div class="search-box">
            <app-search-field
                label="Pesquisar usuário"
                placeholder="Nome ou email"
                (search)="onSearch($event)">
            </app-search-field>

            <button class="filter-btn" [matMenuTriggerFor]="filterMenu">
                <mat-icon>filter_alt</mat-icon>
                Filtrar
            </button>
        </div>
    </div>

    <div class="table-container">

        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef> Nome </th>
                <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
            </ng-container>

            <ng-container matColumnDef="email">
                <th mat-header-cell *matHeaderCellDef> Email </th>
                <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
            </ng-container>

            <ng-container matColumnDef="userType">
                <th mat-header-cell *matHeaderCellDef> Tipo de Usuário </th>
                <td mat-cell *matCellDef="let user"> {{ user.userType }} </td>
            </ng-container>

            <ng-container matColumnDef="active">
                <th mat-header-cell *matHeaderCellDef> Ativo </th>
                <td mat-cell *matCellDef="let user"> 
                    {{ user.active ? 'Sim' : 'Não' }} 
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let user">

                    <button mat-icon-button color="primary">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <button mat-icon-button color="warn">
                        <mat-icon>delete</mat-icon>
                    </button>

                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>

    </div>

    <mat-paginator
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 20]">
    </mat-paginator>

    <mat-menu #filterMenu="matMenu">
        <button mat-menu-item>Ativos</button>
        <button mat-menu-item>Inativos</button>
    </mat-menu>

</div>
