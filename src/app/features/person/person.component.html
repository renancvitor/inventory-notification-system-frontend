<div class="person-page">

  <div class="page-header">
    <div>
      <h1>Pessoas</h1>
      <p>Gerencie os cadastros do sistema • {{ totalPerson }} pessoas cadastradas</p>
    </div>

    <button class="new-person-btn">
      Nova pessoa
    </button>
  </div>

  <div class="toolbar">

    <div class="search-box">
      <span>Pesquisar pessoa</span>

      <div class="search-input">
        <input type="text" placeholder="Nome, CPF ou e-mail">
        <mat-icon>search</mat-icon>
      </div>
    </div>

    <button class="filter-btn">
      <mat-icon>filter_alt</mat-icon>
      Filtrar
    </button>

  </div>

  <div class="table-container">

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="personName">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let person">
          {{ person.personName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef>CPF</th>
        <td mat-cell *matCellDef="let person">
          {{ person.cpf }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let person">
          {{ person.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let person">

          <span
            class="status"
            [class.active]="person.active"
            [class.inactive]="!person.active">

            {{ person.active ? 'Ativo' : 'Inativo' }}

          </span>

        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let person">

          <app-button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </app-button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator
      [length]="totalPerson"
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]">
    </mat-paginator>

  </div>

</div>
