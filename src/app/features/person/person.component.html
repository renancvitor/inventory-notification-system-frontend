<div class="person-page">

  <div class="page-header">
    <div>
      <h1>Pessoas</h1>
      <p>Gerencie os cadastros do sistema • {{ totalPerson }} pessoas cadastradas</p>
    </div>

    <button class="new-person-btn">
      Nova pessoa
    </button>
  </div>

  <div class="toolbar">

    <app-search-field
      label="Pesquisar pessoa"
      placeholder="Nome, CPF ou e-mail"
      (search)="onSearch($event)">
    </app-search-field>

    <button class="filter-btn" [matMenuTriggerFor]="filterMenu">
      <mat-icon>filter_alt</mat-icon>
      Filtrar
    </button>

  </div>

  <div class="table-container">

    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="personName">
        <th mat-header-cell *matHeaderCellDef>Nome</th>
        <td mat-cell *matCellDef="let person">
          {{ person.personName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="cpf">
        <th mat-header-cell *matHeaderCellDef>CPF</th>
        <td mat-cell *matCellDef="let person">
          {{ person.cpf }}
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let person">
          {{ person.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let person">

          <span
            class="status"
            [class.active]="person.active"
            [class.inactive]="!person.active">

            {{ person.active ? 'Ativo' : 'Inativo' }}

          </span>

        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Ações</th>
        <td mat-cell *matCellDef="let person">

          <app-button mat-icon-button color="primary">
            <mat-icon>edit</mat-icon>
          </app-button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    </table>

    <mat-paginator
      [length]="totalPerson"
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 20]">
    </mat-paginator>

  </div>

</div>

<mat-menu #filterMenu="matMenu">

  <app-filter-panel
    (filtersApplied)="applyFilters()"
    (filtersCleared)="clearFilters()"
  >

    <div class="filter-group">

      <span>Status</span>

      <mat-radio-group [(ngModel)]="filters.status" (click)="$event.stopPropagation()">

        <mat-radio-button value="all">
          Todos
        </mat-radio-button>

        <mat-radio-button value="active">
          Ativos
        </mat-radio-button>

        <mat-radio-button value="inactive">
          Inativos
        </mat-radio-button>

      </mat-radio-group>

    </div>

  </app-filter-panel>

</mat-menu>
