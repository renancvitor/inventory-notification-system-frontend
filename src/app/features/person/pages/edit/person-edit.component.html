<div class="person-edit">

  <div class="person-edit__header">

    <h2 class="person-edit__title">{{ personName }}</h2>

    <div class="person-edit__status">
      Status:
      <span
        class="person-edit__status-value"
        [class.person-edit__status-value--active]="isActiveValue"
        [class.person-edit__status-value--inactive]="!isActiveValue"
      >
        {{ isActiveValue ? 'Ativo' : 'Inativo' }}
      </span>
    </div>

  </div>

  <div class="person-edit__card" [formGroup]="form">

    <mat-form-field appearance="outline" class="person-edit__field person-edit__field--full-width">

      <mat-label>Status</mat-label>

      <mat-select formControlName="active">

        <mat-option [value]="true">Ativo</mat-option>
        <mat-option [value]="false">Inativo</mat-option>

      </mat-select>

    </mat-form-field>

  </div>

  <div class="person-edit__actions">

    <div class="person-edit__actions-container">

      <app-button class="person-edit__action person-edit__action--secondary" (click)="cancel()">
        Cancelar
      </app-button>

      <app-button
        class="person-edit__action person-edit__action--primary"
        [disabled]="loading"
        (click)="save()"
      >
        {{ loading ? 'Salvando...' : 'Salvar alterações' }}
      </app-button>

    </div>

  </div>

</div>
